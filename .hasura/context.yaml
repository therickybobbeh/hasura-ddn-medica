---
# Hasura DDN Context Configuration
# Contexts define environment-specific settings for deployment targets

contexts:
  # Local development context (microk8s)
  - name: local
    supergraph: supergraph.yaml
    localEnvFile: .env.local
    cloudEnvFile: .env.cloud.local
    project: "" # Fill with your local/dev project ID
    description: "Local development environment with microk8s"

  # Development context (Azure AKS or self-hosted dev cluster)
  - name: dev
    supergraph: supergraph.yaml
    localEnvFile: .env.dev
    cloudEnvFile: .env.cloud.dev
    project: "" # Fill with your dev project ID
    description: "Development environment for integration testing"

  # Staging context (Azure AKS or self-hosted staging cluster)
  - name: staging
    supergraph: supergraph.yaml
    localEnvFile: .env.staging
    cloudEnvFile: .env.cloud.staging
    project: "" # Fill with your staging project ID
    description: "Staging environment for pre-production testing"

  # Production context (Azure AKS or self-hosted production cluster)
  - name: production
    supergraph: supergraph.yaml
    localEnvFile: .env.prod
    cloudEnvFile: .env.cloud.prod
    project: "" # Fill with your production project ID
    description: "Production environment"

# Default context
currentContext: local
