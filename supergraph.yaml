---
# Hasura DDN Supergraph Configuration (v3)
#
# This file defines the top-level supergraph composition, combining all subgraphs.
# Think of this as the "main" configuration that ties everything together.
#
# WHAT IS A SUPERGRAPH?
# A supergraph is the unified GraphQL API composed of multiple subgraphs.
# Each subgraph represents a domain (auth, database, business logic, etc.)
#
# TODO: Customize this file for your project
# 1. Change the name to match your project
# 2. Add/remove subgraphs as needed
# 3. Update environment variables for your setup

kind: Supergraph
version: v2
definition:
  # TODO: Change this to your project name
  # This will be used in logs, metrics, and documentation
  name: my-api

  # TODO: Update description for your project
  description: "Production-ready Hasura DDN v3 Supergraph for on-premises deployment"

  # Subgraph includes
  # Order matters for dependency resolution (globals should be first)
  #
  # EACH SUBGRAPH REPRESENTS:
  # - globals: Authentication and GraphQL configuration (required)
  # - database: Your primary database (PostgreSQL, MySQL, etc.)
  # - [Add more subgraphs as your project grows]
  #
  # TODO: Add your subgraphs here
  # Examples:
  # - business-logic: Custom TypeScript functions
  # - rest-api: Wrapper for external REST APIs
  # - mongodb: NoSQL database connector
  # - analytics: Analytics database connector
  subgraphs:
    - globals/subgraph.yaml      # Global config (keep this)
    - subgraphs/database-1/subgraph.yaml   # First database
    - subgraphs/database-2/subgraph.yaml   # Second database
    # Add more subgraphs below:
    # - subgraphs/my-business-logic/subgraph.yaml
    # - subgraphs/my-api-wrapper/subgraph.yaml

  # Environment variable mapping
  # Maps environment variables from your .env files to the supergraph
  #
  # TODO: Add any additional environment variables your subgraphs need
  envMapping:
    # Hasura DDN Control Plane (required for cloud features)
    # Get your PAT from: https://console.hasura.io/settings/tokens
    HASURA_DDN_PAT:
      fromEnv: HASURA_DDN_PAT

    # OAuth/OIDC Authentication Configuration
    # TODO: Update these based on your identity provider
    # Supported providers: Keycloak, Auth0, Azure AD, Okta, any OIDC-compliant provider
    OAUTH_ISSUER_URL:
      fromEnv: OAUTH_ISSUER_URL

    OAUTH_AUDIENCE:
      fromEnv: OAUTH_AUDIENCE

    OAUTH_CLIENT_ID:
      fromEnv: OAUTH_CLIENT_ID

    # OpenTelemetry Observability
    # TODO: Update if using different observability stack
    OTEL_EXPORTER_OTLP_ENDPOINT:
      fromEnv: OTEL_EXPORTER_OTLP_ENDPOINT

    OTEL_SERVICE_NAME:
      fromEnv: OTEL_SERVICE_NAME

    # TODO: Add your custom environment variables here
    # Example:
    # MY_API_KEY:
    #   fromEnv: MY_API_KEY
    # DATABASE_URL:
    #   fromEnv: DATABASE_URL

  # Global generator settings
  # These apply to all subgraphs unless overridden
  generator:
    rootPath: .

---
# USAGE NOTES:
#
# 1. Building the supergraph:
#    $ ddn supergraph build local
#    This compiles all subgraphs into engine/build/*.json
#
# 2. Adding a new subgraph:
#    $ ddn subgraph init my-new-subgraph
#    Then add "my-new-subgraph" to the subgraphs list above
#
# 3. Environment-specific configuration:
#    Use .env.local, .env.dev, .env.staging, .env.production
#    Switch with: ddn context use <environment>
#
# 4. Deploying changes:
#    a. Build: ddn supergraph build local
#    b. Review: git diff engine/build/
#    c. Commit: git add . && git commit -m "Update supergraph"
#    d. Tag: git tag -a v1.0.0
#    e. Build image: ./scripts/build-engine.sh v1.0.0
#    f. Deploy: ./scripts/deploy-metadata.sh <env> v1.0.0
#
# COMMON CUSTOMIZATIONS:
#
# - Multiple databases: Add multiple database subgraphs
#   subgraphs:
#     - postgres-primary
#     - postgres-analytics
#     - mongodb-cache
#
# - Microservices: Each service can be a subgraph
#   subgraphs:
#     - auth-service
#     - user-service
#     - order-service
#
# - External APIs: Wrap REST/GraphQL APIs as subgraphs
#   subgraphs:
#     - stripe-api
#     - sendgrid-api
#
# FURTHER READING:
# - Supergraph docs: https://hasura.io/docs/3.0/project-configuration/
# - Subgraphs guide: https://hasura.io/docs/3.0/project-configuration/tutorials/work-with-multiple-subgraphs/
# - Environment config: https://hasura.io/docs/3.0/project-configuration/upgrading-project-config/upgrade-context-v3/
