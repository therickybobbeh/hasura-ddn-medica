---
# Globals Subgraph Configuration
#
# This subgraph contains GLOBAL configuration that applies to the entire supergraph:
# - Authentication (OAuth/OIDC, JWT, webhook)
# - GraphQL API settings (CORS, rate limiting, caching)
# - Security policies (HSTS, CSP, query limits)
#
# WHAT IS THIS FILE?
# - Defines the globals subgraph (always required)
# - Points to global metadata files (AuthConfig.hml, GraphqlConfig.hml)
# - No connector needed (uses built-in Hasura functionality)
#
# WHY SEPARATE SUBGRAPH?
# - Global config doesn't belong to any specific data source
# - Keeps auth/GraphQL settings independent from business logic
# - Easier to manage environment-specific configurations
#
# DO NOT MODIFY UNLESS:
# - You're adding custom global metadata files
# - You need environment-specific global configuration

kind: Subgraph
version: v2
definition:
  # Name must be "globals" (convention for global configuration subgraph)
  # DO NOT CHANGE: Other subgraphs reference this name
  name: globals

  description: "Global authentication and GraphQL configuration"

  generator:
    # Naming convention (not applicable to globals, but required)
    namingConvention: none

  # Include paths for metadata
  # Scans these directories for .hml configuration files
  includePaths:
    - metadata    # Contains AuthConfig.hml and GraphqlConfig.hml

  # No environment mappings needed at subgraph level
  # All environment variables are managed at supergraph level (supergraph.yaml)
  # This keeps global configuration centralized

---
# METADATA FILES IN THIS SUBGRAPH:
#
# 1. metadata/AuthConfig.hml
#    - OAuth/OIDC configuration
#    - JWT token validation
#    - Session variables
#    - Webhook authentication (alternative)
#    See: metadata/AuthConfig.hml and globals/README.md
#
# 2. metadata/GraphqlConfig.hml
#    - CORS settings
#    - Rate limiting
#    - Query complexity limits
#    - Caching configuration
#    - Security headers
#    See: metadata/GraphqlConfig.hml and globals/README.md
#
# USAGE NOTES:
#
# 1. This subgraph is always included first in supergraph.yaml:
#    subgraphs:
#      - globals     # Must be first
#      - database
#      - ...
#
# 2. To modify global configuration:
#    - Edit metadata/AuthConfig.hml or metadata/GraphqlConfig.hml
#    - DO NOT edit this file unless adding new global metadata
#
# 3. Building supergraph:
#    $ ddn supergraph build local
#
# FURTHER READING:
# - Globals README: README.md
# - Authentication: https://hasura.io/docs/3.0/auth/overview/
# - GraphQL Config: https://hasura.io/docs/3.0/api-reference/graphql-config/
