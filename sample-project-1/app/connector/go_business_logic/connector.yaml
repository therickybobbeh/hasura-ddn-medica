kind: Connector
version: v2
definition:
  name: go_business_logic
  subgraph: app
  source: hasura/go:v1.6.0
  context: .
  envMapping:
    HASURA_CONNECTOR_PORT:
      fromEnv: APP_GO_BUSINESS_LOGIC_HASURA_CONNECTOR_PORT
    HASURA_SERVICE_TOKEN_SECRET:
      fromEnv: APP_GO_BUSINESS_LOGIC_HASURA_SERVICE_TOKEN_SECRET
    OTEL_EXPORTER_OTLP_ENDPOINT:
      fromEnv: APP_GO_BUSINESS_LOGIC_OTEL_EXPORTER_OTLP_ENDPOINT
    OTEL_SERVICE_NAME:
      fromEnv: APP_GO_BUSINESS_LOGIC_OTEL_SERVICE_NAME
