include:
  - path: app/connector/neon_postgres_1/compose.yaml
  - path: app/connector/neon_postgres_2/compose.yaml
  - path: app/connector/neon_postgres_lean/compose.yaml
  - path: app/connector/go_buisness_logic_1/compose.yaml
  - path: app/connector/py_buisness_logic_1/compose.yaml
  - path: app/connector/ts_buisness_logic_1/compose.yaml
services:
  engine:
    build:
      context: engine
      dockerfile: Dockerfile.engine
      pull: true
    environment:
      AUTHN_CONFIG_PATH: /md/auth_config.json
      ENABLE_CORS: "true"
      ENABLE_SQL_INTERFACE: "true"
      INTROSPECTION_METADATA_FILE: /md/metadata.json
      METADATA_PATH: /md/open_dd.json
      OTLP_ENDPOINT: http://local.hasura.dev:${OTEL_GRPC_PORT:-4317}
    extra_hosts:
      - local.hasura.dev:host-gateway
    labels:
      io.hasura.ddn.service-name: engine
    ports:
      - target: 3000
        published: ${ENGINE_PORT:-3280}
        protocol: tcp
  otel-collector:
    command:
      - --config=/etc/otel-collector-config.yaml
    environment:
      HASURA_DDN_PAT: ${HASURA_DDN_PAT}
    image: otel/opentelemetry-collector:0.104.0
    ports:
      - target: 4317
        published: ${OTEL_GRPC_PORT:-4317}
        protocol: tcp
      - target: 4318
        published: ${OTEL_HTTP_PORT:-4318}
        protocol: tcp
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
