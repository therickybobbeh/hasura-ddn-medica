name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version tag (e.g., v1.0.0, v1.1.0-beta)'
        required: false
        type: string

env:
  DOCKERHUB_USERNAME: rickybobbeh

jobs:
  build-engine:
    name: Build and Push DDN Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: rickybobbeh/ddn-engine
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile.engine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=rickybobbeh/ddn-engine:buildcache
          cache-to: type=registry,ref=rickybobbeh/ddn-engine:buildcache,mode=max

  build-connector-1:
    name: Build and Push Connector 1 (neon_postgres_1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
