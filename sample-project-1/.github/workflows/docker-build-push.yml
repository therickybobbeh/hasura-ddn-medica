            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app/connector/neon_postgres_1
          file: ./app/connector/neon_postgres_1/.hasura-connector/Dockerfile.neon_postgres_1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=rickybobbeh/ddn-connector-1:buildcache
          cache-to: type=registry,ref=rickybobbeh/ddn-connector-1:buildcache,mode=max

