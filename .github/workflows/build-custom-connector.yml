---
name: Build Custom TypeScript Connector

on:
  push:
    branches:
      - main
    paths:
      - 'connectors/typescript-connector/**'

  pull_request:
    paths:
      - 'connectors/typescript-connector/**'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and Push Connector Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'connectors/typescript-connector/package-lock.json'

      - name: Install dependencies
        working-directory: connectors/typescript-connector
        run: npm ci

      - name: Run tests
        working-directory: connectors/typescript-connector
        run: npm test

      - name: Run linter
        working-directory: connectors/typescript-connector
        run: npm run lint || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=v$(date +%Y%m%d)-${GITHUB_SHA::7}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./connectors/typescript-connector
          file: ./connectors/typescript-connector/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/typescript-connector:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/typescript-connector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/typescript-connector:${{ steps.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Update connector.yaml
        if: github.event_name != 'pull_request'
        run: |
          sed -i "s|image: .*/typescript-connector:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/typescript-connector:${{ steps.version.outputs.version }}|" \
            subgraphs/business-logic/connector/typescript-connector/connector.yaml

      - name: Create PR with updated connector version
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update typescript-connector to ${{ steps.version.outputs.version }}"
          title: "Update TypeScript Connector - ${{ steps.version.outputs.version }}"
          body: |
            ## TypeScript Connector Update

            **New Version**: `${{ steps.version.outputs.version }}`
            **Image**: `${{ secrets.DOCKERHUB_USERNAME }}/typescript-connector:${{ steps.version.outputs.version }}`

            ### Changes
            - Built and pushed new connector image
            - Security scan completed (see artifacts)
            - Updated connector.yaml with new image version

            ### Testing
            - [ ] Unit tests passed
            - [ ] Image security scan completed
            - [ ] Ready to deploy

            ---
            🤖 Generated automatically by GitHub Actions
          branch: auto/connector-update-${{ github.run_number }}
          delete-branch: true
