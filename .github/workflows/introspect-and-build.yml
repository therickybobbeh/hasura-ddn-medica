---
name: Introspect Database and Build Supergraph

on:
  # Run daily to catch database schema changes
  schedule:
    - cron: '0 2 * * *'  # 2 AM daily

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to introspect (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

  # Run on push to main
  push:
    branches:
      - main
    paths:
      - 'subgraphs/*/connector/*/configuration.json'
      - 'subgraphs/*/metadata/**/*.hml'
      - 'supergraph.yaml'

jobs:
  introspect-and-build:
    name: Introspect DB and Build Supergraph
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'connectors/typescript-connector/package-lock.json'

      - name: Install Hasura DDN CLI
        run: |
          npm install -g @hasura/ddn-cli
          ddn version

      - name: Setup environment variables
        env:
          DATABASE_1_URL: ${{ secrets.DATABASE_1_URL }}
          DATABASE_2_URL: ${{ secrets.DATABASE_2_URL }}
          HASURA_DDN_PAT: ${{ secrets.HASURA_DDN_PAT }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: |
          # Create environment file for DDN CLI
          cat > .env.${ENVIRONMENT} <<EOF
          DATABASE_1_URL=${DATABASE_1_URL}
          DATABASE_2_URL=${DATABASE_2_URL}
          HASURA_DDN_PAT=${HASURA_DDN_PAT}
          OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
          EOF

      - name: Introspect databases
        run: |
          # Use the introspection script to handle both databases
          chmod +x scripts/introspect-db.sh
          ./scripts/introspect-db.sh all

      - name: Build supergraph (DDN v3)
        run: |
          # DDN v3 uses 'ddn supergraph build local'
          # This compiles all .hml files into engine/build/*.json
          echo "Building supergraph with DDN v3..."
          ddn supergraph build local

      - name: Verify build output
        run: |
          echo "Checking compiled metadata files..."
          ls -lah engine/build/

          if [ ! -f engine/build/auth_config.json ]; then
            echo "❌ Error: auth_config.json not generated"
            exit 1
          fi

          if [ ! -f engine/build/metadata.json ]; then
            echo "❌ Error: metadata.json not generated"
            exit 1
          fi

          if [ ! -f engine/build/open_dd.json ]; then
            echo "❌ Error: open_dd.json not generated"
            exit 1
          fi

          echo "✅ All required metadata files generated"

      - name: Check for changes
        id: check_changes
        run: |
          # Check for changes in both .hml source files and compiled output
          if git diff --quiet subgraphs/postgres/metadata/ engine/build/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add both source (.hml) and compiled (engine/build/) files
          git add subgraphs/postgres/metadata/
          git add engine/build/

          git commit -m "chore: update database models and compiled metadata

          - Database introspected for ${ENVIRONMENT}
          - Models updated in subgraphs/postgres/metadata/
          - Metadata compiled to engine/build/

          Generated by: ${{ github.workflow }}
          Run: ${{ github.run_number }}"

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update database models and compiled metadata"
          title: "Database Schema Update - ${{ env.ENVIRONMENT }}"
          body: |
            ## Database Schema Changes Detected

            This PR was automatically created by the introspection workflow.

            **Environment**: `${{ env.ENVIRONMENT }}`
            **Timestamp**: ${{ github.event.head_commit.timestamp }}
            **Run**: #${{ github.run_number }}

            ### Changes

            #### Source Files (.hml)
            - Database schema introspected
            - Models updated in `subgraphs/postgres/metadata/`

            #### Compiled Metadata
            - Supergraph compiled to `engine/build/`
            - Ready for engine Docker image build

            ### Files Changed
            ```
            subgraphs/postgres/metadata/**/*.hml  (source)
            engine/build/*.json                   (compiled)
            ```

            ### Next Steps
            1. ✅ Review the changes in `subgraphs/postgres/metadata/`
            2. ✅ Ensure all model permissions are correct
            3. ✅ Verify compiled metadata in `engine/build/`
            4. ✅ Test in staging environment
            5. ✅ Merge to trigger engine image build
            6. ✅ Deploy new engine version: `./scripts/deploy-metadata.sh staging <version>`

            ### Deployment Workflow
            After merge:
            1. Tag the commit: `git tag -a v1.x.x -m "Release v1.x.x"`
            2. Build engine image: `./scripts/build-engine.sh v1.x.x`
            3. Push image: `docker push your-registry/hasura-ddn-engine:v1.x.x`
            4. Deploy to Kubernetes: `./scripts/deploy-metadata.sh <env> v1.x.x`

            ---
            🤖 Generated automatically by GitHub Actions
          branch: auto/db-introspection-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            database-schema
            metadata-update

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: metadata-build-${{ github.run_number }}
          path: |
            engine/build/*.json
            subgraphs/postgres/metadata/**/*.hml
          retention-days: 30

      - name: Summary
        run: |
          echo "## Introspection and Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Detected**: ${{ steps.check_changes.outputs.changes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compiled Metadata Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh engine/build/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
