name: Schema Diff

# Compare schema changes between branches
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to compare against'
        required: true
        type: string
        default: 'main'
      compare_branch:
        description: 'Branch to compare (leave empty for current branch)'
        required: false
        type: string

jobs:
  schema-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hasura DDN CLI
        run: |
          curl -L https://graphql-engine-cdn.hasura.io/ddn/cli/v4/get.sh | bash
          echo "$HOME/.ddn/bin" >> $GITHUB_PATH

      - name: Set DDN context
        run: |
          cd sample-project-1
          ddn context set project hopeful-monkey-8713
          ddn context set supergraph ./supergraph.yaml

      - name: Checkout base branch
        run: |
          git checkout ${{ inputs.base_branch }}

      - name: Build base schema
        run: |
          cd sample-project-1
          ddn supergraph build create --supergraph ./supergraph.yaml --out base-schema.json || echo "Base build failed"

      - name: Checkout compare branch
        run: |
          if [ -n "${{ inputs.compare_branch }}" ]; then
            git checkout ${{ inputs.compare_branch }}
          else
            git checkout -
          fi

      - name: Build compare schema
        run: |
          cd sample-project-1
          ddn supergraph build create --supergraph ./supergraph.yaml --out compare-schema.json || echo "Compare build failed"

      - name: Generate diff report
        run: |
          cd sample-project-1
          echo "# 📊 Schema Diff Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comparing **${{ inputs.base_branch }}** → **${{ inputs.compare_branch || 'current branch' }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Simple diff of metadata files
          echo "## Changed Files" >> $GITHUB_STEP_SUMMARY
          git diff --name-only ${{ inputs.base_branch }}...HEAD -- '*.hml' '*.yaml' | while read file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload schemas as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schema-diff
          path: |
            sample-project-1/base-schema.json
            sample-project-1/compare-schema.json
