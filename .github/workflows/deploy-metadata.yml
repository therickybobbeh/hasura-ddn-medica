---
name: Build and Deploy DDN v3 Engine

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (v1.0.0, v1.0.1, etc.)

jobs:
  build-and-deploy:
    name: Build Engine & Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      DOCKER_REGISTRY: docker.io
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/hasura-ddn-engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hasura DDN CLI
        run: |
          npm install -g @hasura/ddn-cli
          ddn version

      - name: Verify compiled metadata exists
        run: |
          echo "Checking for compiled metadata in engine/build/..."

          if [ ! -d "engine/build" ]; then
            echo "❌ Error: engine/build/ directory not found"
            echo "The metadata must be compiled and committed to Git first"
            echo "Run: ddn supergraph build local && git add engine/build/ && git commit"
            exit 1
          fi

          # Verify all required files exist
          for file in auth_config.json metadata.json open_dd.json; do
            if [ ! -f "engine/build/$file" ]; then
              echo "❌ Error: engine/build/$file not found"
              exit 1
            fi
          done

          echo "✅ All compiled metadata files found"
          ls -lh engine/build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile.engine
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Hasura DDN v3 Engine
            org.opencontainers.image.description=DDN v3 Engine with compiled metadata
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          # Verify connection
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          # Determine namespace based on environment
          case "${{ env.ENVIRONMENT }}" in
            dev)
              NAMESPACE="hasura-dev"
              ;;
            staging)
              NAMESPACE="hasura-staging"
              ;;
            production)
              NAMESPACE="hasura-prod"
              ;;
            *)
              echo "❌ Unknown environment: ${{ env.ENVIRONMENT }}"
              exit 1
              ;;
          esac

          echo "Deploying to namespace: ${NAMESPACE}"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"

          # Update deployment with new image
          kubectl set image deployment/hasura-ddn-engine \
            engine=${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -n ${NAMESPACE}

          # Add annotation with deployment metadata
          kubectl annotate deployment/hasura-ddn-engine \
            kubernetes.io/change-cause="Deployed version ${{ env.VERSION }} - ${{ github.sha }}" \
            -n ${NAMESPACE} \
            --overwrite

          # Wait for rollout to complete
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/hasura-ddn-engine \
            -n ${NAMESPACE} \
            --timeout=5m

      - name: Verify deployment
        run: |
          # Determine namespace
          case "${{ env.ENVIRONMENT }}" in
            dev) NAMESPACE="hasura-dev" ;;
            staging) NAMESPACE="hasura-staging" ;;
            production) NAMESPACE="hasura-prod" ;;
          esac

          echo "Verifying deployment in ${NAMESPACE}..."

          # Check pod status
          kubectl get pods -n ${NAMESPACE} -l app=hasura-ddn,component=engine

          # Get pod logs (last 20 lines)
          echo "Recent engine logs:"
          kubectl logs -n ${NAMESPACE} -l app=hasura-ddn,component=engine --tail=20

      - name: Run smoke tests
        env:
          HASURA_ENGINE_URL: ${{ secrets.HASURA_ENGINE_URL }}
        run: |
          echo "Running smoke tests against: ${HASURA_ENGINE_URL}"

          # Wait a bit for the engine to stabilize
          sleep 10

          # Test health endpoint
          echo "Testing /healthz..."
          if curl -f -s "${HASURA_ENGINE_URL}/healthz"; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            exit 1
          fi

          # Test GraphQL introspection
          echo "Testing GraphQL introspection..."
          RESPONSE=$(curl -s -X POST "${HASURA_ENGINE_URL}/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __schema { queryType { name } } }"}')

          echo "Response: ${RESPONSE}"

          if echo "${RESPONSE}" | grep -q "queryType"; then
            echo "✅ GraphQL introspection passed"
          else
            echo "❌ GraphQL introspection failed"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "kubectl rollout undo deployment/hasura-ddn-engine -n hasura-${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Successfully deployed DDN v3 engine to ${{ env.ENVIRONMENT }}"
          echo "Version: ${{ env.VERSION }}"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."

          case "${{ env.ENVIRONMENT }}" in
            dev) NAMESPACE="hasura-dev" ;;
            staging) NAMESPACE="hasura-staging" ;;
            production) NAMESPACE="hasura-prod" ;;
          esac

          # Automatic rollback
          kubectl rollout undo deployment/hasura-ddn-engine -n ${NAMESPACE}

          echo "Rollback initiated. Check logs:"
          echo "  kubectl logs -n ${NAMESPACE} -l app=hasura-ddn,component=engine --tail=50"

          exit 1
