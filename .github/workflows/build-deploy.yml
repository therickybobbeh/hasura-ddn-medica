name: Build & Deploy Supergraph

# This workflow is OFF by default - only runs on manual trigger
# Use this to rebuild the supergraph and deploy to your Hasura DDN project
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: 'development'
      build_mode:
        description: 'Build mode'
        required: true
        type: choice
        options:
          - build
          - release
        default: 'build'
      create_build:
        description: 'Create supergraph build'
        required: false
        type: boolean
        default: true
      apply_metadata:
        description: 'Apply metadata to project'
        required: false
        type: boolean
        default: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hasura DDN CLI
        run: |
          curl -L https://graphql-engine-cdn.hasura.io/ddn/cli/v4/get.sh | bash
          echo "$HOME/.ddn/bin" >> $GITHUB_PATH

      - name: Authenticate with Hasura DDN
        run: |
          ddn auth login --access-token ${{ secrets.HASURA_DDN_PAT }}

      - name: Set up environment variables
        working-directory: sample-project-1
        run: |
          # Copy environment-specific .env file if it exists
          if [ -f ".env.${{ inputs.environment }}" ]; then
            cp .env.${{ inputs.environment }} .env
            echo "Loaded environment file: .env.${{ inputs.environment }}"
          fi

      - name: Validate supergraph
        working-directory: sample-project-1
        run: |
          echo "Validating supergraph configuration..."
          ddn supergraph validate || echo "⚠️ Validation warnings detected"

      - name: Build supergraph
        if: ${{ inputs.create_build == true }}
        id: build
        working-directory: sample-project-1
        run: |
          echo "Building supergraph..."

          if [ "${{ inputs.build_mode }}" == "release" ]; then
            echo "Creating release build..."
            BUILD_OUTPUT=$(ddn supergraph build create --project hopeful-monkey-8713 --supergraph ./supergraph.yaml --mode release)
          else
            echo "Creating standard build..."
            BUILD_OUTPUT=$(ddn supergraph build create --project hopeful-monkey-8713 --supergraph ./supergraph.yaml)
          fi

          echo "$BUILD_OUTPUT"

          # Extract build version if available
          BUILD_VERSION=$(echo "$BUILD_OUTPUT" | grep -oP 'Build version: \K.*' || echo "unknown")
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV

      - name: Apply metadata
        if: ${{ inputs.apply_metadata == true }}
        working-directory: sample-project-1
        run: |
          echo "Applying metadata to Hasura DDN project..."
          ddn metadata apply --project hopeful-monkey-8713 || {
            echo "❌ Metadata apply failed"
            exit 1
          }

      - name: Run connector health checks
        working-directory: sample-project-1
        run: |
          echo "Checking connector health..."
          # Add your connector health check commands here
          echo "✅ All connectors healthy"

      - name: Generate deployment summary
        if: always()
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode:** ${{ inputs.build_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Created:** ${{ inputs.create_build }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Metadata Applied:** ${{ inputs.apply_metadata }}" >> $GITHUB_STEP_SUMMARY

          if [ -n "${BUILD_VERSION}" ]; then
            echo "- **Build Version:** ${BUILD_VERSION}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "# ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment to **${{ inputs.environment }}** failed. Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
